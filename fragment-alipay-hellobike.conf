# ============================================================
# 支付宝 / 哈啰 小程序规则片段  v3
# 2026-11-20，依据 Shadowrocket 日志实测重写
#
# 【怎么用】整段替换掉你之前粘进去的那一段，位置仍然放在 [Rule] 最上面。
#           如果你之前粘的是旧版（带 IP-CIDR,203.209 那几行），一定要删干净。
#
# 【这一版修了什么】
# 1. 删掉 203.209.230/243/250.0/24 三条 REJECT。
#    日志证据：203.209.243.228 的 SNI 是 mgw.alipay.com —— 支付宝网关。
#    之前把它当广告素材拦了，等于掐掉支付网关，这才是「网络异常」的根源。
# 2. 新增 hellobike / amap / autonavi 直连。
#    日志证据：api/cdn/ip/taxiapi/apmgw/abapi.hellobike.com 全部命中
#    FINAL,PROXY（走代理节点）。原因是这些域名解析出 fake-ip，
#    GEOIP,CN 判不出归属就交给兜底。支付宝发现出口 IP 变了就报网络异常。
# 3. 去广告改成 URL 级拦截：POST /api?adx.ssp.show
#    adx = 广告交易平台，ssp = 供给方平台，这是开屏广告的下发接口。
#    它和登录/下单共用 api.hellobike.com，域名规则区分不了，只能按 URL 拦。
#    需要 HTTPS 解密覆盖 api.hellobike.com；没开则不匹配，自动落到直连。
#
# 【验证方法】改完重开小程序：
#   - 首页、打车、定位都正常  → 网络异常已解决
#   - 开屏不再出现「精选推荐」→ 广告已去掉
#   - 若仍异常，把 URL-REGEX 那行注释掉再看，用于区分是它还是别的原因
# ============================================================

[Rule]

# --- 1. 广告接口（必须排在白名单之前）---
URL-REGEX,^https?://api\.hellobike\.com/api\?adx\.ssp\.show,REJECT

# --- 2. 白名单：拦住误杀，也让这些流量走直连 ---
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,servicewechat.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,tenpay.com,DIRECT
DOMAIN-SUFFIX,mmbiz.qpic.cn,DIRECT
DOMAIN-SUFFIX,mmbiz.qlogo.cn,DIRECT
DOMAIN-SUFFIX,wx.qlogo.cn,DIRECT
DOMAIN-SUFFIX,res.wx.qq.com,DIRECT
DOMAIN-SUFFIX,dldir1.qq.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT
DOMAIN-SUFFIX,hellobike.com,DIRECT
DOMAIN-SUFFIX,amap.com,DIRECT
DOMAIN-SUFFIX,autonavi.com,DIRECT

# --- 你的原有规则从这里开始 ---
