[Rule]
# ==============================================================================
# 一、实测去广告与埋点拦截（必须排在所有 DIRECT 与 RULE-SET 之前）
# ==============================================================================

# --- 1. 哈啰小程序（支付宝端 + 微信端，需 MITM 解密 api.hellobike.com）---
# 核心 SSP 广告下发接口
URL-REGEX,^https?://api\.hellobike\.com/api\?adx\.ssp\.show(?:[&=]|$),REJECT-DICT
# 广告曝光/点击回调上报
URL-REGEX,^https?://api\.hellobike\.com/api\?adx\.ssp\.callback(?:[&=]|$),REJECT-200
# 首页推荐与弹窗接口（如影响正常业务提示，可单独注释对应行）
URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.recommend\.popUp(?:[&=]|$),REJECT-DICT
URL-REGEX,^https?://api\.hellobike\.com/api\?platform\.wx\.popup\.msg(?:[&=]|$),REJECT-DICT
URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.mini\.popup\.window(?:[&=]|$),REJECT-DICT
# 行为埋点上报
URL-REGEX,^https?://api\.hellobike\.com/api\?user\.platform\.event\.upload(?:[&=]|$),REJECT-200
# 营销与第三方广告监测域名
DOMAIN,marketingapi.hellobike.com,REJECT
DOMAIN,admaster-public.51downapp.cn,REJECT

# --- 2. 东方财富 ---
# 广告投放与推广域名（直接域名拦截，无需 MITM）
DOMAIN,emdcadvertise.eastmoney.com,REJECT
DOMAIN,appadvise.eastmoney.com,REJECT
# 拦截 HTTPDNS，避免绕过域名规则直连 IP
DOMAIN,httpdns2.eastmoney.com,REJECT
# 行为日志与统计上报
DOMAIN,bdrt.eastmoney.com,REJECT
DOMAIN,bduserlog.eastmoney.com,REJECT
DOMAIN,bdstatics.eastmoney.com,REJECT
DOMAIN,bd-fireworks.eastmoney.com,REJECT
DOMAIN,probe.eastmoney.com,REJECT
DOMAIN,empointcpf.eastmoney.com,REJECT
# 可选：推荐流与股吧运营位（若需要更彻底可取消注释）
# DOMAIN,emprrec.eastmoney.com,REJECT
# DOMAIN,gboperation.eastmoney.com,REJECT

# --- 3. 新浪财经 ---
# 新浪系广告投放域名
DOMAIN,sax.sina.com.cn,REJECT
DOMAIN,ad.cj.sina.cn,REJECT
DOMAIN,s3adm.ad.weibo.com,REJECT
# 高频信标与日志上报
DOMAIN,beacon.sina.com.cn,REJECT
URL-REGEX,^http://file\.finance\.sina\.com\.cn/finapp/api/logSalvage\.json,REJECT-200
URL-REGEX,^https?://api\.weibo\.cn/2/logservice/attach,REJECT-200

# --- 4. 微信广告上报 & 通用第三方埋点 ---
# 小程序广告/行为数据上报（需 MITM 解密 mp.weixin.qq.com）
URL-REGEX,^https?://mp\.weixin\.qq\.com/intp/mmdata\?action=reportmultimon,REJECT-200
DOMAIN,report-online.sh.wxgateway.com,REJECT
DOMAIN,cnlogs.umeng.com,REJECT
DOMAIN,oth.eve.mdt.qq.com,REJECT

# ==============================================================================
# 二、国内核心业务直连（避免 fake-ip 落入 FINAL,PROXY 触发风控或卡顿）
# ==============================================================================
DOMAIN-SUFFIX,hellobike.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipay.com.cn,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alipay-eco.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT
