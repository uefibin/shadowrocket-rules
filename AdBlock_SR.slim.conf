[Rule]
# ============================================================
# 【顺序是这个文件里最要紧的东西】
# Shadowrocket 自上而下首条命中，且「域名规则优先于 IP 规则」。
# 1. 白名单必须最前：微信/支付宝的核心链路先钉死直连，
#    否则会被后面的广告规则误杀（支付失败、小程序白屏）。
# 2. 广告 IP 段必须在 GEOIP,CN,DIRECT 之前。
#    支付宝广告打的是 203.209.x，这些 IP 归属 CN，
#    放到 GEOIP 后面就永远走 DIRECT，REJECT 不会生效。
# ============================================================

# ---------- 0. 白名单：微信 / 支付宝 核心链路 ----------
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,servicewechat.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,tenpay.com,DIRECT
DOMAIN-SUFFIX,mmbiz.qpic.cn,DIRECT
DOMAIN-SUFFIX,mmbiz.qlogo.cn,DIRECT
DOMAIN-SUFFIX,wx.qlogo.cn,DIRECT
DOMAIN-SUFFIX,res.wx.qq.com,DIRECT
DOMAIN-SUFFIX,dldir1.qq.com,DIRECT
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT

# ============================================================
# 【2026-11-20 真机实测：下面第 1、2 段默认关闭】
#
# 在「支付宝 › 哈啰小程序」实测：开屏广告（天猫商品推广）没拦住，
# 同时小程序弹「网络异常」。规则语法没错，是我在没有真机验证的情况下
# 就默认启用，判断失误。
#
# 为什么拦不住，拆成两件事看：
#   a) 广告素材走阿里图片 CDN（img.alicdn.com 一类），而 alicdn 同时承载
#      商品图、头像、店铺装修图 —— 拦它整个商品详情页都会瞎。
#      白名单里 alicdn 是 DIRECT，所以素材必然加载成功。
#   b) 203.209.230/243/250.0/24 是 11-20 从「支付宝首页」抓到的广告素材段，
#      归属杭州阿里巴巴广告有限公司。但哈啰的开屏广告不走这三个段，打偏了。
#
# 「网络异常」最可能来自 marketingapi.hellobike.com：
#   它不只是营销接口，很可能也是开屏广告配置的下发通道，拦掉后
#   小程序初始化拿不到配置就报网络异常。
#
# 要继续试，一次只去掉一条 #，加完立刻重开小程序：
#   广告消失 + 功能正常 → 保留
#   网络异常 / 白屏 / 支付失败 → 该域名被业务复用，放弃
# ============================================================

# ---------- 1. 支付宝 / 哈啰（默认关闭，未验证）----------
# IP-CIDR,203.209.230.0/24,REJECT,no-resolve
# IP-CIDR,203.209.243.0/24,REJECT,no-resolve
# IP-CIDR,203.209.250.0/24,REJECT,no-resolve
# DOMAIN,marketingapi.hellobike.com,REJECT

# ---------- 2. 腾讯广告 / 优量汇（默认关闭）----------
# 微信小程序里这套是社区通用做法，但小程序广告组件依赖它，
# 拦掉后可能从「广告位空白」变成「加载失败」提示。先在微信里单独试。
# DOMAIN-SUFFIX,gdt.qq.com,REJECT
# DOMAIN-SUFFIX,e.qq.com,REJECT
# DOMAIN-SUFFIX,ad.qq.com,REJECT
# DOMAIN-SUFFIX,ugdtimg.com,REJECT
# DOMAIN-SUFFIX,pgdt.gtimg.cn,REJECT

# ---------- 3. 第三方广告 SDK ----------
# 穿山甲 / GroMore（字节系，小游戏里最常见）
DOMAIN-SUFFIX,pangolin-sdk-toutiao.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao-b.com,REJECT
DOMAIN-SUFFIX,pglstatp-toutiao.com,REJECT
DOMAIN-SUFFIX,lf-cdn-tos.bytescm.com,REJECT
DOMAIN-SUFFIX,tnc3-alisc1.zijieapi.com,REJECT
# 百度联盟
DOMAIN-SUFFIX,mobads.baidu.com,REJECT
# 海外 SDK
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googleadservices.com,REJECT
DOMAIN-SUFFIX,applovin.com,REJECT

# ---------- 4. 可选增强（默认关闭，确认无副作用再开）----------
# 统计/归因接口。能少上传流量，但可能影响「看视频领奖励」的校验。
# DOMAIN-SUFFIX,ctobsnssdk.com,REJECT
# DOMAIN-SUFFIX,cpatrk.net,REJECT
# DOMAIN-SUFFIX,weixinbridge.com,REJECT

