# ============================================================
# 支付宝小程序 去广告规则（基于 2026-11-20 真机抓包）
#
# 【这一版和上一版的区别】
#   上一版（adblock-wx-alipay.conf）是凭经验写的通用域名规则。
#   这一版是把你手机上的真实流量抓下来、逐个 IP 查归属后得出的，
#   只包含抓包里「确实出现、且确实属于广告」的目标。
#
# 【抓包结论 - 先看这段，能省你很多时间】
#   1. 支付宝小程序里没有第三方广告 SDK 的域名。小程序跑不了原生
#      SDK，广告都是 H5 组件，由业务接口直接把广告数据下发。
#   2. 广告素材本身是「裸 IP 直连」，没有域名。抓到的 5 条连接全部
#      打在 203.209.230/243/250 段，归属「杭州阿里巴巴广告有限公司」。
#      → 域名规则拦不住，必须用 IP-CIDR。
#   3. 因此对支付宝来说，能拦的是「广告素材」，拦不了「广告位」。
#      预期效果：广告位置还在，但图片/视频加载不出来（灰块或空白）。
#
# 【用法】同上一版：整段粘到你现有配置 [Rule] 的最上面。
# 【撤销】整段删掉即可。
# ============================================================

[Rule]

# ---------- A 段：阿里广告投放 IP（抓包实测，最有效的一段）----------
# 这 5 个 IP 在 2026-11-20 的抓包里全部命中，443 端口，归属阿里广告。
# no-resolve 表示只对「直接连 IP」的请求生效，不会影响域名规则。

IP-CIDR,203.209.243.0/24,REJECT,no-resolve
IP-CIDR,203.209.250.0/24,REJECT,no-resolve
IP-CIDR,203.209.230.0/24,REJECT,no-resolve

# 注意：这三个 /24 是阿里广告的素材 CDN，和淘宝/支付宝的图片 CDN
# 在物理上是同一批机房。如果发现商品图、头像变成灰块，先把这一段注释掉。


# ---------- B 段：哈啰小程序 营销接口 ----------
# 抓包里 marketingapi.hellobike.com 出现 2 次，是活动/券位的数据源。
# 拦掉后：首页营销活动位可能变空白，「领券」类入口可能打不开。
# 核心打车功能走 api/taxiapi，不受影响。

DOMAIN,marketingapi.hellobike.com,REJECT

# 如果连活动位都不想要，可以再加这条（A/B 实验接口，影响很小）：
# DOMAIN,abapi.hellobike.com,REJECT


# ---------- C 段：抓到了但「不建议拦」的 ----------
# 这些也在抓包里出现，但拦了会出问题，列出来是让你知道我看过了：

# amdc.alipay.com.cn / dataservice.alipayobjects.com
#   → 支付宝的埋点与配置下发。和小程序启动强相关，拦了可能白屏。
# mpsapi.amap.com / logs.amap.com
#   → 高德定位与日志。哈啰是打车/单车类，拦了会定位不准。
# guide-acs.m.taobao.com
#   → 淘系配置中心，多个阿里系小程序共用。
# hermes-rentpms.51downapp.cn
#   → 酒店 PMS 接口，是这个小程序自己的业务后端，与广告无关。


# ---------- 你的原有规则从这里开始 ----------
