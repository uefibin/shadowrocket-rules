# ============================================================
# 支付宝小程序 去广告规则片段  v4
# 生成：2026-11-20
# 依据：真机 Shadowrocket 实时日志流 http://192.168.95.2:1082/api/log
#       抓包窗口 16:16:52 → 16:20:03，165 条 TCP 流 / 141 条带完整 URL 的请求
#       解析脚本：tools/parse_sr_log.py，回放验证：tools/simulate_rules.py
#
# 【这一版只干三件事】
#   1. 把抓包里确认的「广告位接口」按 URL 拦掉（A 段，实测有据）；
#   2. 修一条真实存在的分流 bug：两个阿里风控域名被扔进了代理（C 段）；
#   3. 把「看着像广告、其实不能拦」的接口逐条列出来并说明原因（D 段），
#      免得下次又有人凭名字猜着拦。
#
# 【怎么用】
#   整段复制，粘到你能用的配置 [Rule] 段的最上面（第一条规则之前）。
#   顺序不能动：URL 拦截 → 白名单 → 你自己的规则。
#   撤销：整段删掉。
#
# 【前提：必须开 HTTPS 解密，否则 A 段全废】
#   URL-REGEX 要看得到 path 和 query，没解密只能看到域名。
#   MITM 至少要覆盖 api.hellobike.com（实测对它是可以解密的，
#   小程序不会像 App 本体那样证书固定报错）。
#   Shadowrocket：设置 > HTTPS 解密 > 生成新的 CA 证书 > 安装并信任，
#   然后把 api.hellobike.com 加进配置的 [MITM] hostname。
#   没有解密也不会误伤：URL-REGEX 匹配不到就是不命中，请求照常直连。
# ============================================================

[Rule]

# ------------------------------------------------------------
# A 段：已证实的广告位接口（默认开启）
# ------------------------------------------------------------
# 抓包证据（每条都在 16:17:08 这一秒内成组出现）：
#   tcp stream <59> mitm ssl request  => POST /api?adx.ssp.show
#   tcp stream <59> reject => https://api.hellobike.com/api?adx.ssp.show
#   tcp stream <56> mitm ssl request  => POST /api?homepage.recommend.popUp
#   tcp stream <56> reject => https://api.hellobike.com/api?homepage.recommend.popUp
#
# adx = 广告交易平台（ad exchange），ssp = 供给方平台（supply side platform），
# 这是小程序开屏/插屏广告的物料下发口。homepage.recommend.popUp 是首页推荐弹层。
# 这两条在你当前配置里已经在拦（日志里的 reject 就是它打出来的），保留即可。
#
# 结尾的 (?:[&=#]|$) 是「边界」：避免 adx.ssp.show 顺带把
# adx.ssp.showroom 之类同前缀接口一起拦掉。

URL-REGEX,^https?://api\.hellobike\.com/api\?adx\.ssp\.show(?:[&=#]|$),REJECT
URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.recommend\.popUp(?:[&=#]|$),REJECT


# ------------------------------------------------------------
# B 段：灰度候选（默认全关，一条一条开，开一条重开小程序看一次）
# ------------------------------------------------------------
# 这些都是抓包里真实出现过的「营销/活动位」接口，同域名、不同 query，
# 和登录、订单、打车共用 api.hellobike.com，所以只能按 URL 拦。
#
# 按「副作用从小到大」排序，建议从上往下一条条试：

# B1 首页金刚位角标（红点 / 促销小标）。拦了只是少个角标，主功能无感。
#    抓包 3 次：POST /api?homepage.grid.cornerMark
# URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.grid\.cornerMark(?:[&=#]|$),REJECT

# B2 服务端弹窗消息。拦了「恭喜获得…」「领券提醒」这类营销弹窗会消失，
#    但「你有未支付订单」这类通知也走同一个口，介意的话别开。
#    抓包 3 次：POST /api?msg.toast.user
# URL-REGEX,^https?://api\.hellobike\.com/api\?msg\.toast\.user(?:[&=#]|$),REJECT

# B3 福利中心 / 新人礼包模块。纯营销位，但它是首页「福利」入口的数据源，
#    拦了那个入口会变空白或点不开。
#    抓包 3 次：POST /api?homepage.newWelfare.alipay
# URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.newWelfare\.alipay(?:[&=#]|$),REJECT

# B4 勋章 / 任务活动。同上，活动入口会失效。
#    抓包 3 次：POST /api?applet.homepage.medal.activity
# URL-REGEX,^https?://api\.hellobike\.com/api\?applet\.homepage\.medal\.activity(?:[&=#]|$),REJECT

# B5 券市模块（领券中心）。拦了「领券」会消失，打车优惠也就不领了。
#    抓包 3 次：POST /api?homepage.coupon.mall.module
# URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.coupon\.mall\.module(?:[&=#]|$),REJECT


# ------------------------------------------------------------
# C 段：白名单 + 分流纠偏（这一段是这次抓包最大的收获，别删）
# ------------------------------------------------------------
# 抓包发现两个「必须直连」的阿里域名，在你当前配置里全部命中 FINAL,PROXY
# 走了代理节点（日志原文：mum.alibabachengdun.com 10 次、cdn.ynuf.aliapp.org 3 次，
# 结果全是 `result = FINAL,PROXY # CF官方优选1`）。
#
#   mum.alibabachengdun.com  杭州橙盾信息科技（阿里系），风控/设备指纹类接口。
#   cdn.ynuf.aliapp.org      阿里 WebUMID + 无痕验证码资源（um.js / um.json / wu.json）。
#                            阿里云文档把 ynuf.aliapp.org 明确列为验证码必需域名。
#
# 国内 App 的流量绕到境外节点，轻则验证码转圈，重则被判「网络环境异常」。
# 这两个域名不需要解密、也不需要拦，只需要钉死直连。

DOMAIN-SUFFIX,alibabachengdun.com,DIRECT
DOMAIN-SUFFIX,aliapp.org,DIRECT

# 支付宝本体 / 小程序运行时 / 静态资源
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipay.com.cn,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alipay-eco.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT

# 小程序业务后端 + 定位（拦 adx 的那个域名本身必须直连，
# 否则 URL-REGEX 命中的请求会被后面的规则送去代理，小程序自己就报网络异常）
DOMAIN-SUFFIX,hellobike.com,DIRECT
DOMAIN-SUFFIX,51downapp.cn,DIRECT
DOMAIN-SUFFIX,amap.com,DIRECT
DOMAIN-SUFFIX,autonavi.com,DIRECT


# ------------------------------------------------------------
# D 段：抓到了但绝对不能拦（证据留档，禁止手贱）
# ------------------------------------------------------------
# 下面这些接口在抓包里出现，名字看着都像营销位，实际都承载业务数据。
# 一旦 REJECT，小程序缺数据/白屏，而广告该在还在 —— 上一轮就是这么翻车的。
#
#   POST /api?com.fee.facade.queryUnPaidOrdersAndRecommend   3 次
#       未支付订单 + 推荐，同一个响应里带订单数据。拦了 = 看不到待付款订单。
#   POST /api?ongoing.order.rec.data / user.order.ongoing.sum 3 次
#       进行中订单、订单数量角标。拦了 = 首页订单卡片异常。
#   POST /api?user.login.checkToken / authorizationCode.to.alipayUserId
#       登录态校验与授权码换用户 ID。拦了 = 登录失败。
#   POST /api?homepage.module.newAlipay / homepage.alipay.config
#       首页模块配置。拦了 = 首页模块错乱或空白。
#   POST /api?homepage.shortcut.scene.perception              5 次
#       场景感知（判断你在首页还是打车页）。拦了 = 埋点/场景判断异常。
#   POST /api?bottom.aggregation.tab.info                     7 次（最高频）
#       底部 tab 配置。拦了 = 底部导航消失。
#   POST /api?apmgw / taxiapi / hello-location-based-services
#       支付网关、打车、定位服务。拦了 = 打车和支付直接不可用。
#
#   POST /api?user.platform.event.upload                      4 次
#       埋点上报。技术上可以拦（省流量、少上传），但「看视频领奖励」这类
#       活动的校验可能依赖它，属于默认不开的可选项：
# URL-REGEX,^https?://api\.hellobike\.com/api\?user\.platform\.event\.upload(?:[&=#]|$),REJECT
#
# 还有一组已经证伪的「广告 IP 段」，写在这里防止复活：
#   203.209.243.104 / 203.209.243.148 / 203.209.250.41 在本次抓包里全部带
#   SNI = mgw.alipay.com（日志：tls sniffer catch domain 203.209.243.104 => mgw.alipay.com），
#   这是支付宝网关，不是广告素材。IP-CIDR,...,REJECT 一律不要加。


