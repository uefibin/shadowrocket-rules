# ============================================================
# 微信 / 支付宝 + 小程序 去广告规则（Shadowrocket）
# 生成时间：2026-11-17
#
# 【用法】不要整体导入这个文件！
#   打开 Shadowrocket → 配置 → 点你正在用的配置右侧的 (i) → 编辑
#   把下面 [Rule] 之后、到「你的原有规则从这里开始」之前的所有行，
#   整段复制，粘贴到原有 [Rule] 段落的最上面（第一条规则之前）。
#   规则是「从上到下，先匹配先生效」，所以顺序不能乱。
#
# 【为什么不做 MITM 脚本】
#   微信走 MMTLS、支付宝走 mPaaS，两者都有证书固定。
#   对它们开 HTTPS 解密 = 支付失败 / 登录异常 / 风控提示"网络环境异常"。
#   本地 REJECT 只是让连接失败，相当于弱网，不触碰内容，风控基本无感。
#
# 【撤销】把粘贴进去的这段整段删掉，保存即可，不会影响你原有配置。
# ============================================================

[Rule]

# ---------- 第 0 段：保护白名单（必须在最前面，且不要删）----------
# 作用：微信/支付宝 的核心链路强制直连，避免被后面的广告规则误杀
# 如果是海外用户或节点在日本/香港，把 DIRECT 改成 PROXY 也可以

# 微信本体 / 小程序基础库
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,servicewechat.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,tenpay.com,DIRECT
# 微信图片 / 文件 / 表情
DOMAIN-SUFFIX,mmbiz.qpic.cn,DIRECT
DOMAIN-SUFFIX,mmbiz.qlogo.cn,DIRECT
DOMAIN-SUFFIX,wx.qlogo.cn,DIRECT
DOMAIN-SUFFIX,res.wx.qq.com,DIRECT
DOMAIN-SUFFIX,dldir1.qq.com,DIRECT

# 支付宝本体 / 小程序静态资源
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT


# ---------- 第 1 段：腾讯广告 / 优量汇（微信小程序广告主路径）----------
# 命中率最高的一段。小程序的原生模板广告、激励视频、插屏基本都走这里。
# 拦掉后的表现：广告位空白，或提示「广告加载失败/暂无广告」

DOMAIN-SUFFIX,gdt.qq.com,REJECT          # 广点通 / 优量汇 API（含 v2. mi. 子域）
DOMAIN-SUFFIX,e.qq.com,REJECT            # 腾讯广告落地页
DOMAIN-SUFFIX,ad.qq.com,REJECT           # 微信广告组件域名
DOMAIN-SUFFIX,ugdtimg.com,REJECT         # 广告素材 CDN（含 pgdt. 子域）
DOMAIN-SUFFIX,pgdt.gtimg.cn,REJECT       # 广告图片 CDN


# ---------- 第 2 段：第三方广告 SDK（小程序 / 小游戏常见）----------
# 这部分是「开发者自己接的广告」，支付宝小程序广告大多属于这一类

# 穿山甲 / GroMore（字节系，小程序小游戏里最常见）
DOMAIN-SUFFIX,pangolin-sdk-toutiao.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao1.com,REJECT
DOMAIN-SUFFIX,pangolin-sdk-toutiao-b.com,REJECT
DOMAIN-SUFFIX,pglstatp-toutiao.com,REJECT
DOMAIN-SUFFIX,lf-cdn-tos.bytescm.com,REJECT
DOMAIN-SUFFIX,tnc3-alisc1.zijieapi.com,REJECT

# 百度联盟
DOMAIN-SUFFIX,mobads.baidu.com,REJECT

# 海外 SDK（国内小程序偶见，顺手一起）
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googleadservices.com,REJECT
DOMAIN-SUFFIX,applovin.com,REJECT


# ---------- 第 3 段：可选增强（默认注释，确认无副作用再开）----------
# 统计 / 归因接口。能省流量少上传，但有小概率影响小程序的数据上报或
# 「看视频领奖励」类功能的校验，出问题就注释回去。

# DOMAIN-SUFFIX,ctobsnssdk.com,REJECT      # 字节埋点
# DOMAIN-SUFFIX,cpatrk.net,REJECT          # TalkingData 归因
# DOMAIN-SUFFIX,weixinbridge.com,REJECT    # 微信 WebView 广告（有争议，单独试）


# ---------- 你的原有规则从这里开始 ----------
# 下面接你配置里原本的第一条规则（例如 RULE-SET / FINAL 等）
