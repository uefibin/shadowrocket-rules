# 支付宝小程序：2026-11-20 本机日志分析版
# 这是合并片段，不能作为完整配置单独启用。
# 将下方规则加入现有 [Rule] 最前面，不要新增第二个 [Rule]。
# HTTPS 路径匹配需安装并信任 Shadowrocket CA，且 MITM 包含 api.hellobike.com。
# 将 api.hellobike.com 追加到原有 [MITM] hostname；不要覆盖已有证书字段。
# 使用“配置”路由模式。不要对 *.alipay.com 或全部域名开启解密。

# 已观测：adx.ssp.show 5 次，均被原规则 REJECT。
# 收紧接口结束边界，避免误匹配 adx.ssp.showOther 等其他方法。
URL-REGEX,^https?://api\.hellobike\.com/api\?adx\.ssp\.show(?:[&=]|$),REJECT

# 试验项：用户确认 6 秒“精选推荐”开屏仍出现，现增加此接口做对照验证。
# 观测到 3 次 DIRECT；无响应体，尚不能确认就是截图的开屏来源。
# 本试验版启用；可能同时失去优惠弹窗。若无效或影响功能，注释掉下一行。
URL-REGEX,^https?://api\.hellobike\.com/api\?homepage\.recommend\.popUp(?:[&=]|$),REJECT

# 核心链路直连：这些是放行规则，不是广告规则。
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipay.com.cn,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alipay-eco.com,DIRECT
DOMAIN-SUFFIX,alicdn.com,DIRECT
DOMAIN-SUFFIX,hellobike.com,DIRECT
DOMAIN-SUFFIX,amap.com,DIRECT
DOMAIN-SUFFIX,autonavi.com,DIRECT

# 不添加任何 203.209.* IP 拦截、不封锁整个 api/marketingapi/abapi 域名。
# 同一个 api 域名含登录、定位、未支付订单接口；recommend 不等于广告。
